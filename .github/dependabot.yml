version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates share one pull request; each major update gets
    # its own, so one breaking upgrade can't hold back the safe ones.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node version pinned in .nvmrc; move them with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1;
      # remove once it supports 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
